schema_version = "1.0.0"

# The internal identifier for your extension (must be lowercase alphanumeric and underscores)
id = "studio_generator"

# The version of your extension (must follow Semantic Versioning)
version = "1.1.1"

# The display name shown in the UI
name = "Studio Generator"

# Short description (strictly required instead of 'description')
tagline = "Procedural studio backdrops, cycloramas, and automated lighting rigs."

# Extension type (strictly required)
type = "add-on"

# Author details
maintainer = "Glenn De Backer"

# The license of the code (must be a list of SPDX identifiers)
license = [
    "SPDX:GPL-3.0-or-later"
]

# A web link for documentation or issue tracking (optional)
website = "https://github.com/glenn-de-backer/blender-studio-generator"

# Categorization for the UI
tags = ["Add Mesh", "Lighting", "3D View"]

# The minimum Blender version required to run this extension
blender_version_min = "5.2.0"